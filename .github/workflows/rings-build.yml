name: Rings Windows build
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['rings-*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: |
          $version = '1.0.0'
          if ($env:GITHUB_REF -match '^refs/tags/rings-([0-9]+\.[0-9]+\.[0-9]+)$') { $version = $Matches[1] }
          ./BUILD-RINGS.ps1 -NoOpen -Test -RingsVersion $version
      - uses: actions/upload-artifact@v4
        with:
          name: rings-portable-x64
          path: bin/LGSTrayEx-Rings-Portable-x64.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/rings-') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-first-1.0.0]'))
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rings-portable-x64
          path: release
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = 'release/LGSTrayEx-Rings-Portable-x64.zip'
          if (!(Test-Path $zip)) { throw 'Release archive missing' }
          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            gh release create rings-1.0.0 $zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Battery Monitor v1.0.0" --notes-file RELEASE-NOTES-1.0.0.md --latest
          } else {
            if ($env:GITHUB_REF_NAME -notmatch '^rings-[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
            $version = $env:GITHUB_REF_NAME.Substring(6)
            gh release create $env:GITHUB_REF_NAME $zip --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes --title "Battery Monitor v$version"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
