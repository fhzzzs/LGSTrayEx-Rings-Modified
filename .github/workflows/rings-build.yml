name: Battery Monitor Windows build
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['rings-*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: |
          $version = '2.0.0'
          if ($env:GITHUB_REF -match '^refs/tags/rings-([0-9]+\.[0-9]+\.[0-9]+)$') { $version = $Matches[1] }
          ./BUILD-RINGS.ps1 -NoOpen -Test -RingsVersion $version
      - uses: actions/upload-artifact@v7
        with:
          name: Battery-Monitor-Windows-x64.zip
          path: bin/Battery-Monitor-Windows-x64.zip
          archive: false
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/rings-')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: Battery-Monitor-Windows-x64.zip
          path: release
          skip-decompress: true
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = 'release/Battery-Monitor-Windows-x64.zip'
          if (!(Test-Path $zip)) { throw 'Release archive missing' }
          if ($env:GITHUB_REF_NAME -notmatch '^rings-[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
          $version = $env:GITHUB_REF_NAME.Substring(6)
          gh release create $env:GITHUB_REF_NAME $zip --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes --title "Battery Monitor v$version"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
